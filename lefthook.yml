# Lefthook configuration for git hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,js,mjs,astro,json}"
      run: biome check --fix {staged_files}
      stage_fixed: true
      fail_text: "Biome found issues. Please review and commit again."
    
    oxlint:
      glob: "*.{ts,js,mjs}"
      run: oxlint --fix {staged_files}
      stage_fixed: true
      fail_text: "Oxlint found issues. Please review and commit again."
    
    astro-check:
      glob: "*.{ts,astro}"
      run: bunx astro check --minimumSeverity warning
      fail_text: "Astro type check failed. Fix errors before committing."
    
    seo-check:
      glob: "src/content/blog/*.{md,mdx}"
      run: bun run seo:check
      fail_text: "SEO validation failed. Check frontmatter in blog posts."

pre-push:
  commands:
    ci:
      run: make ci
      fail_text: "Build failed. Fix errors before pushing."
